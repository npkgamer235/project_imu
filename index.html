<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMU Mobile Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0f;
            --card: #12121a;
            --card-border: #1a1a24;
            --accent-green: #00ff88;
            --accent-orange: #ff6b35;
            --accent-cyan: #00d4ff;
            --text: #e8e8e8;
            --text-muted: #6b6b7b;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image:
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        header {
            padding: 24px 32px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background 0.3s;
        }

        .status-dot.active {
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        main {
            flex: 1;
            display: flex;
            gap: 32px;
            padding: 32px;
        }

        .visualizer-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .phone-container {
            width: 200px;
            height: 400px;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .phone {
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #1a1a24, #0d0d14);
            border-radius: 30px;
            border: 3px solid var(--accent-green);
            box-shadow:
                0 0 30px rgba(0, 255, 136, 0.3),
                inset 0 0 60px rgba(0, 0, 0, 0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 24px;
            background: #0a0a0f;
            border-radius: 0 0 16px 16px;
            z-index: 10;
        }

        .phone-screen {
            flex: 1;
            margin: 40px 12px 12px;
            background: linear-gradient(180deg, #0a0a0f, #12121a);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .phone-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 136, 0.03) 2px,
                rgba(0, 255, 136, 0.03) 4px
            );
        }

        .screen-icon {
            font-size: 48px;
            opacity: 0.5;
        }

        .phone-home {
            width: 60px;
            height: 60px;
            border: 2px solid var(--accent-green);
            border-radius: 50%;
            margin: 16px auto;
            opacity: 0.5;
        }

        .data-panel {
            width: 360px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .data-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .card-icon.accel {
            background: rgba(0, 212, 255, 0.15);
            color: var(--accent-cyan);
        }

        .card-icon.gyro {
            background: rgba(255, 107, 53, 0.15);
            color: var(--accent-orange);
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-subtitle {
            font-size: 11px;
            color: var(--text-muted);
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--card-border);
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .data-label {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .axis-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .axis-dot.x { background: #ff4757; }
        .axis-dot.y { background: #2ed573; }
        .axis-dot.z { background: #1e90ff; }

        .data-value {
            font-size: 16px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            min-width: 100px;
            text-align: right;
        }

        .data-value.cyan { color: var(--accent-cyan); }
        .data-value.orange { color: var(--accent-orange); }

        .data-bar {
            height: 4px;
            background: var(--card-border);
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }

        .data-bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.1s ease-out;
        }

        .data-bar-fill.cyan { background: var(--accent-cyan); }
        .data-bar-fill.orange { background: var(--accent-orange); }

        .connect-btn {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--accent-green);
            background: transparent;
            color: var(--accent-green);
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .connect-btn:hover {
            background: var(--accent-green);
            color: var(--bg);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
        }

        .connect-btn.active {
            background: var(--accent-green);
            color: var(--bg);
        }

        .connect-btn.active:hover {
            background: transparent;
            color: var(--accent-green);
        }

        footer {
            padding: 20px 32px;
            border-top: 1px solid var(--card-border);
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .fallback-hint {
            background: rgba(255, 107, 53, 0.1);
            border: 1px solid rgba(255, 107, 53, 0.3);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            color: var(--accent-orange);
        }

        @media (max-width: 768px) {
            main {
                flex-direction: column;
                padding: 20px;
            }

            .data-panel {
                width: 100%;
            }

            .visualizer-panel {
                min-height: 350px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>IMU Visualizer</h1>
        <div class="status-badge">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Disconnected</span>
        </div>
    </header>

    <main>
        <div class="visualizer-panel">
            <div class="phone-container" id="phoneContainer">
                <div class="phone">
                    <div class="phone-notch"></div>
                    <div class="phone-screen">
                        <div class="screen-icon">&#9881;</div>
                    </div>
                    <div class="phone-home"></div>
                </div>
            </div>
        </div>

        <div class="data-panel">
            <div class="data-card">
                <div class="card-header">
                    <div class="card-icon accel">&#9673;</div>
                    <div>
                        <div class="card-title">Accelerometer</div>
                        <div class="card-subtitle">Linear Acceleration (m/s²)</div>
                    </div>
                </div>
                <div class="data-row">
                    <span class="data-label"><span class="axis-dot x"></span>X</span>
                    <span class="data-value cyan" id="accelX">0.00</span>
                </div>
                <div class="data-bar"><div class="data-bar-fill cyan" id="accelXBar" style="width: 50%"></div></div>

                <div class="data-row">
                    <span class="data-label"><span class="axis-dot y"></span>Y</span>
                    <span class="data-value cyan" id="accelY">0.00</span>
                </div>
                <div class="data-bar"><div class="data-bar-fill cyan" id="accelYBar" style="width: 50%"></div></div>

                <div class="data-row">
                    <span class="data-label"><span class="axis-dot z"></span>Z</span>
                    <span class="data-value cyan" id="accelZ">0.00</span>
                </div>
                <div class="data-bar"><div class="data-bar-fill cyan" id="accelZBar" style="width: 50%"></div></div>
            </div>

            <div class="data-card">
                <div class="card-header">
                    <div class="card-icon gyro">&#9680;</div>
                    <div>
                        <div class="card-title">Gyroscope</div>
                        <div class="card-subtitle">Rotation (degrees)</div>
                    </div>
                </div>
                <div class="data-row">
                    <span class="data-label"><span class="axis-dot x"></span>Alpha</span>
                    <span class="data-value orange" id="gyroAlpha">0.00</span>
                </div>
                <div class="data-bar"><div class="data-bar-fill orange" id="gyroAlphaBar" style="width: 0%"></div></div>

                <div class="data-row">
                    <span class="data-label"><span class="axis-dot y"></span>Beta</span>
                    <span class="data-value orange" id="gyroBeta">0.00</span>
                </div>
                <div class="data-bar"><div class="data-bar-fill orange" id="gyroBetaBar" style="width: 50%"></div></div>

                <div class="data-row">
                    <span class="data-label"><span class="axis-dot z"></span>Gamma</span>
                    <span class="data-value orange" id="gyroGamma">0.00</span>
                </div>
                <div class="data-bar"><div class="data-bar-fill orange" id="gyroGammaBar" style="width: 50%"></div></div>
            </div>

            <button class="connect-btn" id="connectBtn">Connect Sensors</button>

            <div class="fallback-hint" id="fallbackHint" style="display: none;">
                Desktop mode: Move mouse to rotate phone
            </div>
        </div>
    </main>

    <footer>
        <p>IMU Mobile Visualizer &mdash; Real-time accelerometer and gyroscope visualization</p>
    </footer>

    <script>
        const phoneContainer = document.getElementById('phoneContainer');
        const connectBtn = document.getElementById('connectBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const fallbackHint = document.getElementById('fallbackHint');

        const accelX = document.getElementById('accelX');
        const accelY = document.getElementById('accelY');
        const accelZ = document.getElementById('accelZ');
        const gyroAlpha = document.getElementById('gyroAlpha');
        const gyroBeta = document.getElementById('gyroBeta');
        const gyroGamma = document.getElementById('gyroGamma');

        const accelXBar = document.getElementById('accelXBar');
        const accelYBar = document.getElementById('accelYBar');
        const accelZBar = document.getElementById('accelZBar');
        const gyroAlphaBar = document.getElementById('gyroAlphaBar');
        const gyroBetaBar = document.getElementById('gyroBetaBar');
        const gyroGammaBar = document.getElementById('gyroGammaBar');

        let isConnected = false;
        let useFallback = true;

        // Current rotation values
        let currentAlpha = 0;
        let currentBeta = 0;
        let currentGamma = 0;

        // Target rotation for smooth interpolation
        let targetAlpha = 0;
        let targetBeta = 0;
        let targetGamma = 0;

        function normalizeAngle(angle) {
            return ((angle % 360) + 360) % 360;
        }

        function lerp(current, target, factor) {
            return current + (target - current) * factor;
        }

        function updatePhoneRotation() {
            currentAlpha = lerp(currentAlpha, targetAlpha, 0.15);
            currentBeta = lerp(currentBeta, targetBeta, 0.15);
            currentGamma = lerp(currentGamma, targetGamma, 0.15);

            const rotateX = currentBeta;
            const rotateY = currentGamma;
            const rotateZ = currentAlpha;

            phoneContainer.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) rotateZ(${rotateZ}deg)`;

            requestAnimationFrame(updatePhoneRotation);
        }

        function updateBar(barElement, value, maxValue) {
            const normalized = Math.min(Math.abs(value) / maxValue, 1) * 100;
            barElement.style.width = normalized + '%';
        }

        function formatValue(value) {
            const num = parseFloat(value);
            return num.toFixed(2);
        }

        function handleOrientation(event) {
            targetAlpha = event.alpha || 0;
            targetBeta = event.beta || 0;
            targetGamma = event.gamma || 0;

            gyroAlpha.textContent = formatValue(targetAlpha);
            gyroBeta.textContent = formatValue(targetBeta);
            gyroGamma.textContent = formatValue(targetGamma);

            updateBar(gyroAlphaBar, targetAlpha, 360);
            updateBar(gyroBetaBar, targetBeta, 180);
            updateBar(gyroGammaBar, targetGamma, 90);
        }

        function handleMotion(event) {
            const acc = event.accelerationIncludingGravity || event.acceleration;

            if (acc) {
                const x = acc.x || 0;
                const y = acc.y || 0;
                const z = acc.z || 0;

                accelX.textContent = formatValue(x);
                accelY.textContent = formatValue(y);
                accelZ.textContent = formatValue(z);

                updateBar(accelXBar, x, 20);
                updateBar(accelYBar, y, 20);
                updateBar(accelZBar, z, 20);
            }
        }

        function handleMouseMove(event) {
            if (!useFallback) return;

            const rect = document.body.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const normalizedX = (event.clientX - centerX) / centerX;
            const normalizedY = (event.clientY - centerY) / centerY;

            targetBeta = normalizedY * 45;
            targetGamma = normalizedX * 60;
        }

        function requestSensorPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            startSensorListening();
                        } else {
                            alert('Sensor permission denied');
                        }
                    })
                    .catch(console.error);
            } else {
                startSensorListening();
            }
        }

        function startSensorListening() {
            window.addEventListener('deviceorientation', handleOrientation);
            window.addEventListener('devicemotion', handleMotion);

            useFallback = false;
            fallbackHint.style.display = 'none';

            statusDot.classList.add('active');
            statusText.textContent = 'Connected';
            connectBtn.classList.add('active');
            connectBtn.textContent = 'Disconnect';
            isConnected = true;
        }

        function stopSensorListening() {
            window.removeEventListener('deviceorientation', handleOrientation);
            window.removeEventListener('devicemotion', handleMotion);

            useFallback = true;
            if (window.innerWidth > 768) {
                fallbackHint.style.display = 'block';
            }

            statusDot.classList.remove('active');
            statusText.textContent = 'Disconnected';
            connectBtn.classList.remove('active');
            connectBtn.textContent = 'Connect Sensors';
            isConnected = false;

            // Reset values
            targetAlpha = targetBeta = targetGamma = 0;
        }

        connectBtn.addEventListener('click', () => {
            if (isConnected) {
                stopSensorListening();
            } else {
                requestSensorPermission();
            }
        });

        // Desktop fallback with mouse
        document.addEventListener('mousemove', handleMouseMove);

        // Check if we need fallback mode
        if (!('DeviceOrientationEvent' in window)) {
            fallbackHint.style.display = 'block';
            useFallback = true;
        }

        // Start animation loop
        updatePhoneRotation();
    </script>
</body>
</html>
