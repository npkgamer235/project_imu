<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMU Mobile Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0f;
            --card: #12121a;
            --card-border: #1a1a24;
            --accent-green: #00ff88;
            --accent-orange: #ff6b35;
            --accent-cyan: #00d4ff;
            --text: #e8e8e8;
            --text-muted: #6b6b7b;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image:
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        header {
            padding: 24px 32px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background 0.3s;
        }

        .status-dot.active {
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        main {
            flex: 1;
            display: flex;
            gap: 32px;
            padding: 32px;
        }

        .visualizer-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            overflow: hidden;
        }

        .scene {
            position: relative;
            transform-style: preserve-3d;
            width: 300px;
            height: 300px;
        }

        .table {
            position: absolute;
            width: 400px;
            height: 400px;
            bottom: -150px;
            left: 50%;
            transform: translateX(-50%) rotateX(90deg);
            background: linear-gradient(135deg, #1a1a24 0%, #12121a 100%);
            border: 2px solid #2a2a3a;
            border-radius: 8px;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.5),
                inset 0 0 60px rgba(0, 255, 136, 0.02);
        }

        .table::before {
            content: '';
            position: absolute;
            inset: 20px;
            border: 1px solid rgba(0, 255, 136, 0.1);
            border-radius: 4px;
        }

        .table::after {
            content: 'SURFACE';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(-180deg);
            font-size: 10px;
            letter-spacing: 4px;
            color: rgba(0, 255, 136, 0.15);
        }

        .phone-stand {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 10px;
            background: linear-gradient(180deg, #3a3a4a, #2a2a3a);
            border-radius: 2px;
            transform-style: preserve-3d;
        }

        .phone-container {
            width: 200px;
            height: 400px;
            transform-style: preserve-3d;
            position: relative;
            z-index: 10;
            transition: transform 0.08s ease-out;
        }

        .phone {
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #1a1a24, #0d0d14);
            border-radius: 30px;
            border: 3px solid var(--accent-green);
            box-shadow:
                0 0 30px rgba(0, 255, 136, 0.3),
                inset 0 0 60px rgba(0, 0, 0, 0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 24px;
            background: #0a0a0f;
            border-radius: 0 0 16px 16px;
            z-index: 10;
        }

        .phone-screen {
            flex: 1;
            margin: 40px 12px 12px;
            background: linear-gradient(180deg, #0a0a0f, #12121a);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .phone-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 136, 0.03) 2px,
                rgba(0, 255, 136, 0.03) 4px
            );
        }

        .screen-icon {
            font-size: 48px;
            opacity: 0.5;
        }

        .phone-home {
            width: 60px;
            height: 60px;
            border: 2px solid var(--accent-green);
            border-radius: 50%;
            margin: 16px auto;
            opacity: 0.5;
        }

        .data-panel {
            width: 360px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .data-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .card-icon.accel {
            background: rgba(0, 212, 255, 0.15);
            color: var(--accent-cyan);
        }

        .card-icon.gyro {
            background: rgba(255, 107, 53, 0.15);
            color: var(--accent-orange);
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-subtitle {
            font-size: 11px;
            color: var(--text-muted);
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--card-border);
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .angle-gauge {
            width: 60px;
            height: 60px;
            position: relative;
        }

        .angle-gauge svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .angle-gauge .track {
            fill: none;
            stroke: var(--card-border);
            stroke-width: 4;
        }

        .angle-gauge .fill {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.1s ease-out;
        }

        .angle-gauge.cyan .fill { stroke: var(--accent-cyan); }
        .angle-gauge.orange .fill { stroke: var(--accent-orange); }

        .angle-gauge .value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            font-weight: 500;
        }

        .angle-gauge.cyan .value { color: var(--accent-cyan); }
        .angle-gauge.orange .value { color: var(--accent-orange); }

        .data-label {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .axis-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .axis-dot.x { background: #ff4757; }
        .axis-dot.y { background: #2ed573; }
        .axis-dot.z { background: #1e90ff; }

        .data-value {
            font-size: 16px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            min-width: 100px;
            text-align: right;
        }

        .data-value.cyan { color: var(--accent-cyan); }
        .data-value.orange { color: var(--accent-orange); }

        .gauge-container {
            display: flex;
            justify-content: space-around;
            padding: 16px 0;
            gap: 12px;
        }

        .gauge-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .gauge-label {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lock-btn {
            background: transparent;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 4px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lock-btn:hover {
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }

        .lock-btn.locked {
            background: rgba(255, 107, 53, 0.2);
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }

        .lock-btn.locked svg path:nth-child(2) {
            display: none;
        }

        .gauge-wrapper {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .data-bar {
            height: 4px;
            background: var(--card-border);
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }

        .data-bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.1s ease-out;
        }

        .data-bar-fill.cyan { background: var(--accent-cyan); }
        .data-bar-fill.orange { background: var(--accent-orange); }

        .connect-btn {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--accent-green);
            background: transparent;
            color: var(--accent-green);
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .connect-btn:hover {
            background: var(--accent-green);
            color: var(--bg);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
        }

        .connect-btn.active {
            background: var(--accent-green);
            color: var(--bg);
        }

        .connect-btn.active:hover {
            background: transparent;
            color: var(--accent-green);
        }

        footer {
            padding: 20px 32px;
            border-top: 1px solid var(--card-border);
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .fallback-hint {
            background: rgba(255, 107, 53, 0.1);
            border: 1px solid rgba(255, 107, 53, 0.3);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            color: var(--accent-orange);
        }

        @media (max-width: 768px) {
            main {
                flex-direction: column;
                padding: 20px;
            }

            .data-panel {
                width: 100%;
            }

            .visualizer-panel {
                min-height: 350px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>IMU Visualizer</h1>
        <div class="status-badge">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Disconnected</span>
        </div>
    </header>

    <main>
        <div class="visualizer-panel">
            <div class="scene">
                <div class="table"></div>
                <div class="phone-stand"></div>
                <div class="phone-container" id="phoneContainer">
                    <div class="phone">
                        <div class="phone-notch"></div>
                        <div class="phone-screen">
                            <div class="screen-icon">&#9881;</div>
                        </div>
                        <div class="phone-home"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="data-panel">
            <div class="data-card">
                <div class="card-header">
                    <div class="card-icon accel">&#9673;</div>
                    <div>
                        <div class="card-title">Accelerometer</div>
                        <div class="card-subtitle">Linear Acceleration (m/s²)</div>
                    </div>
                </div>
                <div class="gauge-container">
                    <div class="gauge-item">
                        <div class="angle-gauge cyan">
                            <svg viewBox="0 0 36 36">
                                <circle class="track" cx="18" cy="18" r="15"/>
                                <circle class="fill" cx="18" cy="18" r="15"
                                    stroke-dasharray="94.25"
                                    stroke-dashoffset="47.12"
                                    id="accelXGauge"/>
                            </svg>
                            <span class="value" id="accelX">0.0</span>
                        </div>
                        <span class="gauge-label"><span class="axis-dot x"></span>X</span>
                    </div>
                    <div class="gauge-item">
                        <div class="angle-gauge cyan">
                            <svg viewBox="0 0 36 36">
                                <circle class="track" cx="18" cy="18" r="15"/>
                                <circle class="fill" cx="18" cy="18" r="15"
                                    stroke-dasharray="94.25"
                                    stroke-dashoffset="47.12"
                                    id="accelYGauge"/>
                            </svg>
                            <span class="value" id="accelY">0.0</span>
                        </div>
                        <span class="gauge-label"><span class="axis-dot y"></span>Y</span>
                    </div>
                    <div class="gauge-item">
                        <div class="angle-gauge cyan">
                            <svg viewBox="0 0 36 36">
                                <circle class="track" cx="18" cy="18" r="15"/>
                                <circle class="fill" cx="18" cy="18" r="15"
                                    stroke-dasharray="94.25"
                                    stroke-dashoffset="47.12"
                                    id="accelZGauge"/>
                            </svg>
                            <span class="value" id="accelZ">0.0</span>
                        </div>
                        <span class="gauge-label"><span class="axis-dot z"></span>Z</span>
                    </div>
                </div>
            </div>

            <div class="data-card">
                <div class="card-header">
                    <div class="card-icon gyro">&#9680;</div>
                    <div>
                        <div class="card-title">Gyroscope</div>
                        <div class="card-subtitle">Rotation (degrees)</div>
                    </div>
                </div>
                <div class="gauge-container">
                    <div class="gauge-item">
                        <div class="angle-gauge orange">
                            <svg viewBox="0 0 36 36">
                                <circle class="track" cx="18" cy="18" r="15"/>
                                <circle class="fill" cx="18" cy="18" r="15"
                                    stroke-dasharray="94.25"
                                    stroke-dashoffset="47.12"
                                    id="gyroAlphaGauge"/>
                            </svg>
                            <span class="value" id="gyroAlpha">0</span>
                        </div>
                        <span class="gauge-label"><span class="axis-dot x"></span>&alpha;</span>
                        <button class="lock-btn" id="lockAlpha" title="Lock alpha axis">
                            <svg viewBox="0 0 24 24" width="16" height="16">
                                <path fill="currentColor" d="M12 17a2 2 0 0 0 2-2 2 2 0 0 0-2-2 2 2 0 0 0-2 2 2 2 0 0 0 2 2m6-9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2h1V6a5 5 0 0 1 5-5 5 5 0 0 1 5 5v2h1m-6-5a3 3 0 0 0-3 3v2h6V6a3 3 0 0 0-3-3z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="gauge-item">
                        <div class="angle-gauge orange">
                            <svg viewBox="0 0 36 36">
                                <circle class="track" cx="18" cy="18" r="15"/>
                                <circle class="fill" cx="18" cy="18" r="15"
                                    stroke-dasharray="94.25"
                                    stroke-dashoffset="47.12"
                                    id="gyroBetaGauge"/>
                            </svg>
                            <span class="value" id="gyroBeta">90</span>
                        </div>
                        <span class="gauge-label"><span class="axis-dot y"></span>&beta;</span>
                        <button class="lock-btn" id="lockBeta" title="Lock beta axis">
                            <svg viewBox="0 0 24 24" width="16" height="16">
                                <path fill="currentColor" d="M12 17a2 2 0 0 0 2-2 2 2 0 0 0-2-2 2 2 0 0 0-2 2 2 2 0 0 0 2 2m6-9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2h1V6a5 5 0 0 1 5-5 5 5 0 0 1 5 5v2h1m-6-5a3 3 0 0 0-3 3v2h6V6a3 3 0 0 0-3-3z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="gauge-item">
                        <div class="angle-gauge orange">
                            <svg viewBox="0 0 36 36">
                                <circle class="track" cx="18" cy="18" r="15"/>
                                <circle class="fill" cx="18" cy="18" r="15"
                                    stroke-dasharray="94.25"
                                    stroke-dashoffset="47.12"
                                    id="gyroGammaGauge"/>
                            </svg>
                            <span class="value" id="gyroGamma">0</span>
                        </div>
                        <span class="gauge-label"><span class="axis-dot z"></span>&gamma;</span>
                        <button class="lock-btn" id="lockGamma" title="Lock gamma axis">
                            <svg viewBox="0 0 24 24" width="16" height="16">
                                <path fill="currentColor" d="M12 17a2 2 0 0 0 2-2 2 2 0 0 0-2-2 2 2 0 0 0-2 2 2 2 0 0 0 2 2m6-9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2h1V6a5 5 0 0 1 5-5 5 5 0 0 1 5 5v2h1m-6-5a3 3 0 0 0-3 3v2h6V6a3 3 0 0 0-3-3z"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <button class="connect-btn" id="connectBtn">Connect Sensors</button>

            <div class="fallback-hint" id="fallbackHint" style="display: none;">
                Desktop mode: Move mouse to rotate phone
            </div>
        </div>
    </main>

    <footer>
        <p>IMU Mobile Visualizer &mdash; Real-time accelerometer and gyroscope visualization</p>
    </footer>

    <script>
        const phoneContainer = document.getElementById('phoneContainer');
        const connectBtn = document.getElementById('connectBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const fallbackHint = document.getElementById('fallbackHint');

        const accelX = document.getElementById('accelX');
        const accelY = document.getElementById('accelY');
        const accelZ = document.getElementById('accelZ');
        const gyroAlpha = document.getElementById('gyroAlpha');
        const gyroBeta = document.getElementById('gyroBeta');
        const gyroGamma = document.getElementById('gyroGamma');

        const accelXGauge = document.getElementById('accelXGauge');
        const accelYGauge = document.getElementById('accelYGauge');
        const accelZGauge = document.getElementById('accelZGauge');
        const gyroAlphaGauge = document.getElementById('gyroAlphaGauge');
        const gyroBetaGauge = document.getElementById('gyroBetaGauge');
        const gyroGammaGauge = document.getElementById('gyroGammaGauge');

        let isConnected = false;
        let useFallback = true;

        // Current rotation values
        let currentAlpha = 0;
        let currentBeta = 90;
        let currentGamma = 0;

        // Target rotation for smooth interpolation
        let targetAlpha = 0;
        let targetBeta = 90;
        let targetGamma = 0;

        // Lock states for each axis
        let lockAlpha = false;
        let lockBeta = false;
        let lockGamma = false;

        // Lock button elements
        const lockAlphaBtn = document.getElementById('lockAlpha');
        const lockBetaBtn = document.getElementById('lockBeta');
        const lockGammaBtn = document.getElementById('lockGamma');

        // Add click handlers for lock buttons
        lockAlphaBtn.addEventListener('click', () => {
            lockAlpha = !lockAlpha;
            lockAlphaBtn.classList.toggle('locked', lockAlpha);
        });

        lockBetaBtn.addEventListener('click', () => {
            lockBeta = !lockBeta;
            lockBetaBtn.classList.toggle('locked', lockBeta);
        });

        lockGammaBtn.addEventListener('click', () => {
            lockGamma = !lockGamma;
            lockGammaBtn.classList.toggle('locked', lockGamma);
        });

        function shortestAnglePath(current, target) {
            let diff = target - current;
            while (diff > 180) diff -= 360;
            while (diff < -180) diff += 360;
            return current + diff;
        }

        function lerp(current, target, factor) {
            return current + (target - current) * factor;
        }

        function updatePhoneRotation() {
            // Only update non-locked axes
            if (!lockAlpha) {
                currentAlpha = shortestAnglePath(currentAlpha, targetAlpha);
            }
            if (!lockBeta) {
                currentBeta = lerp(currentBeta, targetBeta, 0.12);
            }
            if (!lockGamma) {
                currentGamma = lerp(currentGamma, targetGamma, 0.12);
            }

            const flatBeta = 90 - currentBeta;
            const tiltGamma = currentGamma;
            const rotateZ = currentAlpha;

            phoneContainer.style.transform = `rotateX(${flatBeta}deg) rotateY(${tiltGamma}deg) rotateZ(${rotateZ}deg)`;

            requestAnimationFrame(updatePhoneRotation);
        }

        function updateBar(barElement, value, maxValue) {
            const normalized = Math.min(Math.abs(value) / maxValue, 1) * 100;
            barElement.style.width = normalized + '%';
        }

        function formatValue(value) {
            const num = parseFloat(value);
            return num.toFixed(2);
        }

        function handleOrientation(event) {
            targetAlpha = event.alpha || 0;
            targetBeta = event.beta || 0;
            targetGamma = event.gamma || 0;

            gyroAlpha.textContent = Math.round(targetAlpha);
            gyroBeta.textContent = Math.round(targetBeta);
            gyroGamma.textContent = Math.round(targetGamma);

            updateGauge(gyroAlphaGauge, targetAlpha, 360);
            updateGauge(gyroBetaGauge, targetBeta, 180);
            updateGauge(gyroGammaGauge, targetGamma, 90);
        }

        function handleMotion(event) {
            const acc = event.accelerationIncludingGravity || event.acceleration;

            if (acc) {
                const x = acc.x || 0;
                const y = acc.y || 0;
                const z = acc.z || 0;

                accelX.textContent = formatValue(x);
                accelY.textContent = formatValue(y);
                accelZ.textContent = formatValue(z);

                updateGauge(accelXGauge, x, 20);
                updateGauge(accelYGauge, y, 20);
                updateGauge(accelZGauge, z, 20);
            }
        }

        function updateGauge(gaugeElement, value, maxValue) {
            const circumference = 94.25; // 2 * PI * 15
            const percent = (Math.abs(value) % maxValue) / maxValue;
            const offset = circumference * (1 - percent);
            gaugeElement.style.strokeDashoffset = offset;
        }

        function handleMouseMove(event) {
            if (!useFallback) return;

            const rect = document.body.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const normalizedX = (event.clientX - centerX) / centerX;
            const normalizedY = (event.clientY - centerY) / centerY;

            // When upright, beta around 90, gamma around 0
            // Mouse Y moves vertical tilt (beta), mouse X moves rotation (alpha)
            targetBeta = 90 + normalizedY * 60;  // Vertical tilt
            targetGamma = normalizedX * 40;     // Left/right tilt
        }

        function requestSensorPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            startSensorListening();
                        } else {
                            alert('Sensor permission denied');
                        }
                    })
                    .catch(console.error);
            } else {
                startSensorListening();
            }
        }

        function startSensorListening() {
            window.addEventListener('deviceorientation', handleOrientation);
            window.addEventListener('devicemotion', handleMotion);

            useFallback = false;
            fallbackHint.style.display = 'none';

            statusDot.classList.add('active');
            statusText.textContent = 'Connected';
            connectBtn.classList.add('active');
            connectBtn.textContent = 'Disconnect';
            isConnected = true;
        }

        function stopSensorListening() {
            window.removeEventListener('deviceorientation', handleOrientation);
            window.removeEventListener('devicemotion', handleMotion);

            useFallback = true;
            if (window.innerWidth > 768) {
                fallbackHint.style.display = 'block';
            }

            statusDot.classList.remove('active');
            statusText.textContent = 'Disconnected';
            connectBtn.classList.remove('active');
            connectBtn.textContent = 'Connect Sensors';
            isConnected = false;

            // Reset values - phone upright on table
            targetAlpha = 0;
            targetBeta = 90;  // Upright
            targetGamma = 0;
        }

        connectBtn.addEventListener('click', () => {
            if (isConnected) {
                stopSensorListening();
            } else {
                requestSensorPermission();
            }
        });

        // Desktop fallback with mouse
        document.addEventListener('mousemove', handleMouseMove);

        // Check if we need fallback mode
        if (!('DeviceOrientationEvent' in window)) {
            fallbackHint.style.display = 'block';
            useFallback = true;
        }

        // Start animation loop
        updatePhoneRotation();
    </script>
</body>
</html>
